name: CI/CD pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: cloud-deployment/exp26

      # Step 4: Lint code
      - name: Lint code
        run: npm run lint --if-present
        working-directory: cloud-deployment/exp26

      # Step 5: Run tests
      - name: Run tests
        run: npm test -- --watch=false
        working-directory: cloud-deployment/exp26

      # Step 6: Build production files
      - name: Build production files
        run: npm run build
        working-directory: cloud-deployment/exp26

      # Step 7: Upload build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: cloud-deployment/exp26/build
